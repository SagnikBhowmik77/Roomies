services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roomies}
      POSTGRES_USER: ${POSTGRES_USER:-roomies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomies}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roomies}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DB: ${POSTGRES_DB:-roomies}
      POSTGRES_USER: ${POSTGRES_USER:-roomies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomies}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker --loglevel=info
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DB: ${POSTGRES_DB:-roomies}
      POSTGRES_USER: ${POSTGRES_USER:-roomies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomies}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:

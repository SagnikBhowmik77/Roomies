server {
    listen 80;

    # SPA: serve static assets, fall back to index.html for client routes
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Same-origin API: proxy to Django so the browser never needs CORS.
    # The resolver + variable force nginx to re-resolve "web" per request
    # via Docker's embedded DNS — otherwise nginx caches the container IP
    # at startup and serves 502s forever after `web` is recreated.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
